<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prestige Photography - Asset Scanner</title>
    <!-- Include html5-qrcode library for camera scanning -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #111;
        }
        #reader {
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #eef2f7;
            border-left: 4px solid #0066cc;
            font-family: monospace;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Asset QR Scanner</h2>
        <div id="reader"></div>
        <div class="result-box" id="scan-result">
            <strong>Scanned Data:</strong> <span id="asset-output">Waiting for scan...</span>
        </div>
    </div>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            // Display the scanned QR code content
            document.getElementById('asset-output').innerText = decodedText;
            console.log(`Code matched = ${decodedText}`, decodedResult);
            
            // Optional: You can add an automatic redirect or inventory lookup action here
        }

        function onScanFailure(error) {
            // Handle scan failure or ongoing scan frames silently to avoid console spam
        }

        // Initialize the camera scanner targeting the QR code format specifically
        let html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" }, // Uses the back camera on tablets/phones
            {
                fps: 10,    // Frames per second
                qrbox: { width: 250, height: 250 } // Scanning area box
            },
            onScanSuccess,
            onScanFailure
        ).catch((err) => {
            console.error(`Unable to start scanning, error: ${err}`);
            document.getElementById('asset-output').innerText = "Camera error: Check permissions.";
        });
    </script>

</body>
</html>
